services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/sentinel.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - sentinel-data:/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  sentinel-data:
